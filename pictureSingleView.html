<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page-single-view">

    <nav>
        <a href="#" class="sandwichIcon" onclick="openNav()">&#9776;</a>
        <h2 id="welcometext" class="welcomeText">Welcome to PICTURA an extravaganza of photos</h2>
    </nav>   
    
    <div id="myNav" class="overlay">
        <p class="close-icon" onclick="closeNav()"> &times; </p>
        <div class="overlay-content">
            <a href="index.html" tabindex="2">HOME</a>
            <a href="aboutUs.html">About Us</a>        
            <a href="joinUs.html" class="box join-box" id="signUpCurtain" tabindex="2">Join Us</a>
            <a href="gallery.html" class="box open-gallery2" tabindex="2">Open Gallery</a>
            <a href="upLoad.html" class="box upload-box2" tabindex="2">Upload</a>
        </div>
    </div>

    <div class="mainContainer">
        <main class="mainContent page-single-view" id="maincontent">
            <div class="gallery-grid2" id="gallerygrid2">
                <picture class="photoitem14 photoitem" id="photoitem14">
                    <img src="#" alt="Photo 14" id="currentPhoto"> 
                </picture>
            </div>
        </main>
        <aside class="sidebar">
            <div class="outer-container page-single-view">
                <div class="grid-container page-single-view">
                    <p id="loginText" class="loginText"></p> <!--This stores the Logged In / Logged Out Text - Text Set with JScipt' -->
                    <input text="username" title="username" type="text" id="loginname" placeholder="Login Name" class="login-name-box" tabindex="2">
                    <input text="password" title="password" type="password" id="password" placeholder="Password" class="password-box" tabindex="3">
                    <a class="box login-box half-disabled-link" id="login-Btn2" onclick="loginUser()" tabindex="4"></a>  <!--This is the login button - Text Set with JScript-->
                    <a class="box open-gallery half-disabled-link" id="opengallery" href="gallery.html" tabindex="5">Return<br>Gallery</a>
                    <a class="box home-box" href="index.html" tabindex="6">Home</a>
                    <a class="box about-box half-disabled-link" href="aboutUs.html" tabindex="6">About Us</a>
                    <a class="box join-box half-disabled-link" id="signUpButton2" href="joinUs.html" tabindex="7">Join Us</a>
                    <a class="box upload-box half-disabled-link" href="upLoad.html" tabindex="8">Upload</a>

                    <a class="box photoStarRatingText" id="photoStarRatingText">Rate This Pic</a>             
                    <a class="box photoStarRatingDisplay" id="photoStarRatingDisplay"></a>             
                </div>
            </div>
        </aside>
        <div class="footer-bar">
            <p>A website for picture enthusiasts<br>Created by Peter Cunningham</p>
        </div>
    </div>

    <script src="auth.js" type="module"></script>
    <script src="userControl.js"></script>
    <script src="screenSetup.js"></script>
    <script src="picturesSingleView.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const imageSource = urlParams.get('src');
    
    const detailDiv = document.getElementById('photoitem14'); 
    
    if (imageSource && detailDiv) {
        const detailImage = detailDiv.querySelector('img'); 

        if (detailImage) {
            detailImage.src = decodeURIComponent(imageSource); 
            updateStarsFromCurrentImage(); 
        } else {
            detailDiv.alt = "Error: Image tag not found inside photoitem14.";
        }
    } else {
        if (detailDiv) {
            detailDiv.querySelector('img').alt = "Error: Image source not found in URL.";
        }
    }
}); 

document.addEventListener('DOMContentLoaded', (showSingleImage));
document.addEventListener('DOMContentLoaded', (window.addEventListener('resize', debounce(showSingleImageReload))));
</script>

</body>
</html>
